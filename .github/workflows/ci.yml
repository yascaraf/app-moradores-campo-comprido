name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar o código
        run: flutter analyze

      - name: Rodar os testes com cobertura
        run: flutter test --coverage

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info

  build:
    name: Build do APK
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar o APK de depuração
        run: flutter build apk --debug